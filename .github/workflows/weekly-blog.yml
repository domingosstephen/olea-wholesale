name: Daily Blog Generation

on:
  # Run every day at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: 'generate'
        type: choice
        options:
          - generate
          - research
          - research-and-approve
          - stats
          - dry-run
      article_count:
        description: 'Number of articles (1-3)'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3']
      research_strategy:
        description: 'Research strategy'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - keyword
          - competitor
          - question

permissions:
  contents: write

jobs:
  blog-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install tsx
        run: npm install -g tsx

      # Stats
      - name: Show stats
        if: ${{ github.event.inputs.action == 'stats' || github.event_name == 'schedule' }}
        run: npx tsx scripts/blog-engine/run.ts --stats

      # Research
      - name: Research new topics
        if: ${{ github.event.inputs.action == 'research' || github.event.inputs.action == 'research-and-approve' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          STRATEGY="${{ github.event.inputs.research_strategy || 'all' }}"
          npx tsx scripts/blog-engine/researcher.ts --strategy "$STRATEGY"

      - name: Auto-approve researched topics
        if: ${{ github.event.inputs.action == 'research-and-approve' }}
        run: |
          npx tsx scripts/blog-engine/researcher.ts --approve-all
          npx tsx scripts/blog-engine/researcher.ts --sync

      # Generate
      - name: Generate articles
        if: ${{ github.event.inputs.action == 'generate' || github.event.inputs.action == '' || github.event_name == 'schedule' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          COUNT="${{ github.event.inputs.article_count || '1' }}"
          npx tsx scripts/blog-engine/run.ts --count "$COUNT"

      # Dry run
      - name: Dry run
        if: ${{ github.event.inputs.action == 'dry-run' }}
        run: npx tsx scripts/blog-engine/run.ts --dry-run

      # Internal linking (run after generation)
      - name: Run internal linking
        if: ${{ github.event.inputs.action == 'generate' || github.event.inputs.action == '' || github.event_name == 'schedule' }}
        run: node scripts/internal-linking.js

      # Final stats
      - name: Show final stats
        if: always()
        run: npx tsx scripts/blog-engine/run.ts --stats

      # Commit
      - name: Commit and push
        if: ${{ github.event.inputs.action != 'stats' && github.event.inputs.action != 'dry-run' }}
        run: |
          git config user.name "Olea Blog Engine"
          git config user.email "blog-engine@olea-wholesale.com"

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add content/blog/*.json 2>/dev/null || true
          git add scripts/blog-engine/published.json 2>/dev/null || true
          git add scripts/blog-engine/pending-topics.json 2>/dev/null || true
          git add scripts/blog-engine/addon-topics.json 2>/dev/null || true

          ACTION="${{ github.event.inputs.action || 'generate' }}"
          if [ "$ACTION" = "research" ] || [ "$ACTION" = "research-and-approve" ]; then
            MSG="blog: research new topics [automated]"
          else
            POST_COUNT=$(git diff --cached --name-only | grep "content/blog/" | wc -l || echo "0")
            MSG="blog: add ${POST_COUNT} new article(s) [automated]"
          fi

          git commit -m "$MSG

          Generated by Olea Blog Engine via GitHub Actions."

          git push
